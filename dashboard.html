<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://cdn.tailwindcss.com/3.4.17"></script><script src="https://cdn.jsdelivr.net/npm/pocketbase@0.26.8/dist/pocketbase.umd.js"></script><script src="mock.js"></script><script src="app.js"></script><link rel="icon" href="logo.jpeg"><title>Dashboard – Noble's Groceries</title></head>
<body class="bg-slate-50 text-slate-800"><div id="app"></div>
<script>
if (guard()) {
const U = () => pb.authStore.record, uf = () => 'user="' + U().id + '"';
const planOf = s => s.expand?.plan || {};
const subs = () => pb.collection('subscriptions').getFullList({ filter: uf(), expand: 'plan', sort: '-created' });
const pays = () => pb.collection('payments').getFullList({ filter: uf(), expand: 'subscription.plan', sort: '-created' });
// progress counts savings only: late penalties are fees, not savings
const sum = (l, s) => l.filter(p => p.status === 'confirmed' && (!s || p.subscription === s)).reduce((a, p) => a + p.amount - (p.penalty || 0), 0);
const bar = pc => `<div class="h-1.5 bg-slate-100 rounded-full mt-3"><div class="h-1.5 bg-emerald-700 rounded-full" style="width:${pc}%"></div></div>`;
const dueLine = (st, f) => !st.left ? '<span class="text-emerald-800 font-medium">Fully paid</span>'
  : st.overdue ? `<span class="text-red-600 font-medium">${plural(st.overdue, f)} overdue · ${naira(st.overdue * st.A * RULES.lateMultiplier)} due now (includes ${naira(st.overdue * st.pen)} penalty)</span>`
  : `Next payment due <b class="font-medium text-slate-700">${fmtDue(f, st.next)}</b>`;

window.PLAN_ACTION = p => `<button onclick="closePlan();join('${p.id}')" class="${btn} w-full py-2.5">Join this plan</button>`;
window.join = async id => { try { await pb.collection('subscriptions').create({ user: U().id, plan: id, status: 'active' }); toast('Plan joined'); location.hash = 'mine'; } catch (e) { toast(e.message, 1); } };

// Payment form: enforces the lateness penalty, accepts advance payments, shows what the amount covers and the next due date
window.pay = async sid => {
  const [s, all] = await Promise.all([subs(), pays()]), sub = s.find(x => x.id === sid), pl = planOf(sub), f = pl.frequency, m = RULES.lateMultiplier;
  const st0 = planState(sub, pl, all);
  if (!st0.left) return toast('This plan is already fully paid.', 1);
  modal('Pay for ' + esc(pl.name),
    '<div id="qh"></div>' + fld('Amount (₦)', 'amount', st0.cost(0), 'number', 'required min="1" step="1"') + '<div id="qv"></div>' + fld('Payment reference / note', 'note', '', 'text', 'placeholder="e.g. transfer ref"'),
    async d => {
      const st = planState(sub, pl, await pays()), q = quoteFor(st, +d.amount);
      if (!q.ok) { paint(); throw new Error('The amount due has changed (a deadline may have just passed). Please check the new amount.'); }
      await pb.collection('payments').create({ user: U().id, subscription: sid, amount: q.total, note: d.note, status: 'pending', penalty: q.penalty, installments: q.n, late_count: q.late });
      toast(`${naira(q.total)} submitted · covers ${plural(q.n, f)}` + (q.next ? ` · next payment due ${fmtDue(f, q.next)}` : ' · plan fully paid'), 0, 8000);
    }, 'Submit payment');
  const am = $('input[name="amount"]'), qh = $('#qh'), qv = $('#qv');
  const box = (c, h) => `<div class="rounded-lg border p-3 text-sm ${c}">${h}</div>`;
  const paint = () => {
    const st = planState(sub, pl, all), amt = +am.value, q = quoteFor(st, amt);
    qh.innerHTML = st.overdue
      ? box('bg-red-50 border-red-200 text-red-700', `<b>Payment overdue.</b> ${plural(st.overdue, f)} missed. Each costs ${naira(st.A)} + ${naira(st.pen)} late penalty = ${naira(st.A * m)}. Minimum to pay now: ${naira(st.cost(0))}.`)
      : box('bg-emerald-50 border-emerald-200 text-emerald-800', `Next payment due <b>${fmtDue(f, st.next)}</b>. Pay before then to avoid the ${naira(st.pen)} late penalty.`);
    if (!(amt > 0)) qv.innerHTML = '<p class="text-slate-500">Enter an amount.</p>';
    else if (q.ok) qv.innerHTML = `<p class="font-medium text-slate-900">Covers ${plural(q.n, f)}</p><p class="text-slate-600 mt-1">Savings ${naira(q.base)}${q.penalty ? ` + <span class="text-amber-800 font-medium">late penalty ${naira(q.penalty)}</span> (${plural(q.late, f)} late)` : ''}</p><p class="text-slate-600 mt-1">${q.next ? `Next payment due <b>${fmtDue(f, q.next)}</b>` : 'This completes your plan.'}</p>`;
    else {
      const why = amt < st.cost(0) ? `The minimum payment is ${naira(st.cost(0))}${st.overdue ? ' (includes the late penalty)' : ''}.` : amt > q.max ? `That is more than the remaining balance of ${naira(q.max)}.` : `${naira(amt)} is not a whole number of payments.`;
      const opts = [...new Set([q.lower, q.higher].filter(Boolean))];
      qv.innerHTML = `<p class="text-red-600">${why}</p><div class="flex flex-wrap gap-2 mt-2">${opts.map(v => `<button type="button" data-amt="${v}" class="${btn2} !py-1 !px-2.5 text-xs">Pay ${naira(v)} · ${plural(q.cum.indexOf(v), f)}</button>`).join('')}</div>`;
    }
  };
  qv.onclick = e => { const b = e.target.closest('[data-amt]'); if (b) { am.value = b.dataset.amt; paint(); } };
  am.oninput = paint; paint();
  const iv = setInterval(() => document.body.contains(am) ? paint() : clearInterval(iv), 15000);   // re-check when a deadline passes
};
window.payout = sid => modal('Request payout', fld('Delivery or bank details', 'note', '', 'text', 'required'), d => pb.collection('payouts').create({ user: U().id, subscription: sid, note: d.note, status: 'pending' }).then(() => toast('Payout requested')));

layout({ brand: "Noble's Groceries", nav: [['overview', 'Overview'], ['plans', 'Browse plans'], ['mine', 'My contributions'], ['payments', 'Payments'], ['payouts', 'Payouts'], ['rules', 'Payment rules'], ['profile', 'Profile']], views: {
  async overview(m) {
    const [s, p] = await Promise.all([subs(), pays()]), act = s.filter(x => x.status === 'active');
    m.innerHTML = head('Welcome back, ' + esc((U().name || 'there').split(' ')[0]), 'A summary of your savings activity.', `<a href="#plans" class="${btn}">Browse plans</a>`)
      + '<div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-8">' + stat('Active plans', act.length) + stat('Total contributed', naira(sum(p)), 'Confirmed savings, excluding penalties') + stat('Awaiting confirmation', p.filter(x => x.status === 'pending').length, 'Payments under review') + stat('Expected payout', naira(act.reduce((a, x) => a + (planOf(x).payout || 0), 0)), 'Across active plans') + '</div>'
      + '<div class="grid lg:grid-cols-5 gap-6"><div class="lg:col-span-2"><h2 class="text-sm font-semibold mb-3">Active plans</h2>' + (act.length ? '<div class="space-y-3">' + act.map(x => { const pl = planOf(x), t = pl.amount * pl.duration, pc = Math.min(100, Math.round(sum(p, x.id) / t * 100) || 0); return `<a href="#mine" class="block bg-white border rounded-xl p-4 hover:border-emerald-700"><div class="flex justify-between text-sm"><span class="font-medium">${esc(pl.name)}</span><span class="text-slate-500">${pc}%</span></div>${bar(pc)}<p class="text-xs text-slate-500 mt-2">${dueLine(planState(x, pl, p), pl.frequency)}</p></a>`; }).join('') + '</div>' : `<div class="bg-white border border-dashed rounded-xl p-6 text-sm text-slate-500">You have not joined a plan yet. <a href="#plans" class="text-emerald-800 font-medium">Browse plans</a></div>`) + '</div>'
      + '<div class="lg:col-span-3"><div class="flex justify-between mb-3"><h2 class="text-sm font-semibold">Recent payments</h2><a href="#payments" class="text-sm text-emerald-800 font-medium">View all</a></div>' + table(['Date', 'Plan', 'Amount', 'Status'], p.slice(0, 5).map(x => [date(x.created), esc(planOf(x.expand?.subscription || {}).name), naira(x.amount), badge(x.status)])) + '</div></div>';
  },
  async plans(m) {
    const l = await pb.collection('plans').getFullList({ filter: 'active=true' });
    m.innerHTML = head('Browse plans', 'Search, filter and compare every plan, then join in one click.') + '<div id="ex"></div>';
    explorer($('#ex'), l, { quick: p => `<button onclick="join('${p.id}')" class="${btn} flex-1">Join plan</button>` });
  },
  async mine(m) {
    const [s, p] = await Promise.all([subs(), pays()]);
    m.innerHTML = head('My contributions', 'Track progress, due dates and penalties on every plan you have joined.') + (s.length ? '<div class="grid md:grid-cols-2 gap-4">' + s.map(x => {
      const pl = planOf(x), t = pl.amount * pl.duration, paid = sum(p, x.id), pc = Math.min(100, Math.round(paid / t * 100) || 0), st = planState(x, pl, p);
      return `<div class="bg-white border rounded-xl p-5"><div class="flex justify-between items-start"><h3 class="font-semibold">${esc(pl.name)}</h3>${badge(x.status)}</div><p class="text-sm text-slate-500 mt-1">${naira(pl.amount)} ${pl.frequency} · started ${date(x.created)}</p>${bar(pc)}<p class="text-sm mt-2">${naira(paid)} of ${naira(t)} <span class="text-slate-500">(${pc}%)</span></p><p class="text-xs text-slate-500 mt-1">${st.paid} of ${pl.duration} ${FQ[pl.frequency]}s covered (including payments awaiting confirmation)</p>${x.status === 'active' ? `<p class="text-sm text-slate-500 mt-3">${dueLine(st, pl.frequency)}</p>` : ''}<div class="flex gap-2 mt-4">${x.status === 'active' && st.left ? `<button onclick="pay('${x.id}')" class="${btn}">Make payment</button>` : ''}${pc >= 100 && x.status !== 'cancelled' ? `<button onclick="payout('${x.id}')" class="${btn2}">Request payout</button>` : ''}</div></div>`;
    }).join('') + '</div>' : table([], []));
  },
  async payments(m) { const p = await pays(); m.innerHTML = head('Payments', 'Your payment history. Late penalties are shown separately.') + table(['Date', 'Plan', 'Amount', 'Covers', 'Penalty', 'Note', 'Status'], p.map(x => [date(x.created), esc(planOf(x.expand?.subscription || {}).name), naira(x.amount), covers(x), penBadge(x), esc(x.note), badge(x.status)])); },
  async payouts(m) { const l = await pb.collection('payouts').getFullList({ filter: uf(), expand: 'subscription.plan', sort: '-created' }); m.innerHTML = head('Payouts', 'Your payout requests.') + table(['Date', 'Plan', 'Details', 'Status'], l.map(x => [date(x.created), esc(planOf(x.expand?.subscription || {}).name), esc(x.note), badge(x.status)])); },
  async rules(m) { m.innerHTML = head('Payment rules', 'How due dates, late penalties and advance payments work.') + rulesHTML(); },
  async profile(m) {
    const u = U(); m.innerHTML = head('Profile', 'Update your details.') + `<form id="pf2" class="bg-white border rounded-xl p-6 max-w-md space-y-3">${fld('Full name', 'name', u.name)}${fld('Country', 'country', u.country)}${fld('Phone', 'phone', u.phone)}<button class="${btn}">Save changes</button></form>`;
    $('#pf2').onsubmit = async e => { e.preventDefault(); try { await pb.collection('users').update(u.id, Object.fromEntries(new FormData(e.target))); toast('Saved'); } catch (x) { toast(x.message, 1); } };
  }
} });
}
</script></body></html>
