<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://cdn.tailwindcss.com/3.4.17"></script><script src="https://cdn.jsdelivr.net/npm/pocketbase@0.26.8/dist/pocketbase.umd.js"></script><script src="mock.js"></script><script src="app.js"></script><link rel="icon" href="logo.jpeg"><title>Admin – Noble's Groceries</title></head>
<body class="bg-slate-50 text-slate-800"><div id="app"></div>
<script>
if(guard('admin')){
const col=c=>pb.collection(c), nm=x=>esc(x?.name||x?.email||'—');
const ab=(label,fn,cls='border')=>'<button onclick="'+fn+'" class="px-2.5 py-1 text-xs rounded-md '+cls+'">'+label+'</button> ';
window.PLAN_ACTION=p=>'<button onclick="closePlan();planForm(\''+p.id+'\')" class="'+btn+' w-full py-2.5">Edit plan</button>';
window.setRec=async(c,id,f,v)=>{try{await col(c).update(id,{[f]:v});refresh()}catch(e){toast(e.message,1)}};
window.delRec=async(c,id)=>{if(confirm('Delete this record?')){try{await col(c).delete(id);refresh()}catch(e){toast(e.message,1)}}};
window.planForm=async id=>{const p=id?await col('plans').getOne(id):{category:'cash',frequency:'daily',active:true};
 modal(id?'Edit plan':'Add plan',fld('Name','name',p.name,'text','required')+sel('Category','category',['cash','grocery'],p.category)+sel('Frequency','frequency',['daily','weekly','monthly'],p.frequency)+fld('Amount per payment (₦)','amount',p.amount,'number','required')+fld('Number of payments','duration',p.duration,'number','required')+fld('Payout value (₦)','payout',p.payout,'number')+fld('Description / items','description',p.description)+sel('Active','active',['true','false'],String(p.active)),
 d=>{d.active=d.active==='true';['amount','duration','payout'].forEach(k=>d[k]=Number(d[k])||0);return id?col('plans').update(id,d):col('plans').create(d)})};
window.seed=async()=>{const P=[];
 [['Grocery Plan 1',250,'50kg Rice, 5L Groundnut Oil, 1 Carton of Indomitable'],['Grocery Plan 2',500,'2 Bags of 50kg Rice, 10kg Semo, 5L Groundnut Oil, 1 Carton of Indomitable, 2 Packets of Knorr Cubes'],['Grocery Plan 3',800,'3 Bags of 50kg Rice, 5L Groundnut Oil, 3 Cartons of Indomitable, 2 Cartons of Spaghetti, 2 Packets of Knorr Cubes'],['Grocery Plan 4',1000,'4 Bags of 50kg Rice, 10kg Groundnut Oil, 10kg Semo, 4 Cartons of Indomitable, 1 Carton of Spaghetti']].forEach(([n,a,d])=>P.push({name:n,category:'grocery',frequency:'daily',amount:a,duration:365,payout:a*365,description:d,active:true}));
 [['daily',365,[100,200,300,400,500,1000,1500,2000,2500,3000]],['weekly',53,[500,1000,1500,2000,2500,3000]],['monthly',12,[2000,2500,3000,5000,10000,15000,20000]]].forEach(([f,n,l])=>l.forEach(a=>P.push({name:cap(f)+' Savings '+naira(a),category:'cash',frequency:f,amount:a,duration:n,payout:a*n,description:'',active:true})));
 try{for(const p of P)await col('plans').create(p);toast('Default plans added');refresh()}catch(e){toast(e.message,1)}};

layout({brand:'Noble\'s Admin',nav:[['overview','Overview'],['users','Users'],['plans','Plans'],['subs','Contributions'],['payments','Payments'],['payouts','Payouts'],['rules','Payment rules']],views:{
 async rules(m){m.innerHTML=head('Payment rules','The rules members are held to.')+rulesHTML()},
 async overview(m){const [u,s,pp,pa,pl]=await Promise.all([col('users').getList(1,1),col('subscriptions').getList(1,1),col('payments').getList(1,1,{filter:'status="pending"'}),col('payments').getFullList({filter:'status="confirmed"'}),col('plans').getList(1,1)]);
  m.innerHTML=head('Overview','Platform summary.')+(pl.totalItems?'':'<div class="mb-6 bg-amber-50 border border-amber-200 rounded-xl p-5 flex flex-wrap items-center justify-between gap-3 text-sm"><span>No plans exist yet, so users have nothing to join.</span><button onclick="seed()" class="px-4 py-2 rounded-lg bg-emerald-600 text-white">Add default plans</button></div>')+'<div class="grid sm:grid-cols-2 lg:grid-cols-5 gap-4">'+stat('Users',u.totalItems)+stat('Contributions',s.totalItems)+stat('Pending payments',pp.totalItems)+stat('Confirmed total',naira(pa.reduce((a,p)=>a+p.amount,0)),'Savings + penalties')+stat('Penalties collected',naira(pa.reduce((a,p)=>a+(p.penalty||0),0)),'From late payments')+'</div>'},
 async users(m){const l=await col('users').getFullList({sort:'-created'});
  m.innerHTML=head('Users',l.length+' registered')+table(['Name','Email','Phone','Country','Role','Joined',''],l.map(u=>[esc(u.name),esc(u.email),esc(u.phone),esc(u.country),u.role==='admin'?badge('active').replace('active','admin'):'user',date(u.created),ab(u.role==='admin'?'Make user':'Make admin','setRec(\'users\',\''+u.id+'\',\'role\',\''+(u.role==='admin'?'user':'admin')+'\')')]))},
 async plans(m){const l=await col('plans').getFullList({sort:'category,frequency,amount'});
  m.innerHTML=head('Plans','Search, filter and manage contribution plans.',(l.length?'':'<button onclick="seed()" class="'+btn2+'">Add default plans</button>')+'<button onclick="planForm()" class="'+btn+'">Add plan</button>')+'<div id="ex"></div>';
  explorer($('#ex'),l,{cols:{heads:['Name','Type','Frequency','Amount','Payments','Payout','Status',''],row:(p,i)=>['<button onclick="openPlan('+i+')" class="font-medium text-emerald-800 hover:underline">'+esc(p.name)+'</button>',p.category,p.frequency,naira(p.amount),p.duration,naira(p.payout),badge(p.active?'active':'cancelled').replace('Cancelled','Hidden'),ab('Edit','planForm(\''+p.id+'\')')+ab('Delete','delRec(\'plans\',\''+p.id+'\')','border text-red-600')]}});},
 async subs(m){const l=await col('subscriptions').getFullList({expand:'user,plan',sort:'-created'});
  m.innerHTML=head('Contributions','All user subscriptions to plans.')+table(['User','Plan','Status','Started',''],l.map(s=>[nm(s.expand?.user),esc(s.expand?.plan?.name),badge(s.status),date(s.created),s.status==='active'?ab('Complete','setRec(\'subscriptions\',\''+s.id+'\',\'status\',\'completed\')')+ab('Cancel','setRec(\'subscriptions\',\''+s.id+'\',\'status\',\'cancelled\')','border text-red-600'):'']))},
 async payouts(m){const l=await col('payouts').getFullList({expand:'user,subscription.plan',sort:'-created'});m.innerHTML=head('Payout requests','Review and mark payouts as paid.')+table(['Date','User','Plan','Details','Status',''],l.map(p=>[date(p.created),nm(p.expand?.user),esc(p.expand?.subscription?.expand?.plan?.name),esc(p.note),badge(p.status),p.status==='pending'?ab('Mark paid','setRec(\'payouts\',\''+p.id+'\',\'status\',\'confirmed\')','bg-emerald-600 text-white')+ab('Reject','setRec(\'payouts\',\''+p.id+'\',\'status\',\'rejected\')','border text-red-600'):'']))},
 async payments(m){const l=await col('payments').getFullList({expand:'user,subscription.plan',sort:'-created'});
  m.innerHTML=head('Payments','Confirm or reject submitted payments. Late payments are flagged with their penalty.')+table(['Date','User','Plan','Amount','Covers','Penalty','Note','Status',''],l.map(p=>[date(p.created),nm(p.expand?.user),esc(p.expand?.subscription?.expand?.plan?.name),naira(p.amount),covers(p),penBadge(p),esc(p.note),badge(p.status),p.status==='pending'?ab('Confirm','setRec(\'payments\',\''+p.id+'\',\'status\',\'confirmed\')','bg-emerald-600 text-white')+ab('Reject','setRec(\'payments\',\''+p.id+'\',\'status\',\'rejected\')','border text-red-600'):'']))}
}});}
</script></body></html>
